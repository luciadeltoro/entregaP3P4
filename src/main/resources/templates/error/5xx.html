<!DOCTYPE html>
<!-- Plantilla de respaldo para errores HTTP 5xx generados por el servidor. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error del servidor</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<main class="page">
    <section class="card error-card">
        <div class="label">Página de error personalizada · servidor</div>
        <p class="status">HTTP <span th:text="${status}">500</span></p>
        <h1>Se produjo un error en el servidor</h1>
        <p>El servidor no pudo completar la petición. Prueba de nuevo más tarde.</p>
        <!-- No se muestra el mensaje ni el stack trace de la excepción al usuario. -->
        <p class="muted">Ruta: <code th:text="${path}">/ruta</code></p>
        <div class="actions">
            <a class="button" th:href="@{/}">Volver al inicio</a>
        </div>
    </section>
</main>
</body>
</html>
